<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow - Task Manager</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
      <!-- ================= SIDEBAR ================= -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">✓</div>
          <span>TaskFlow</span>
        </div>

        <nav class="navigation">
          <button class="nav-item active" data-filter="all">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
          </button>

          <button class="nav-item" data-filter="all">
            <span class="nav-icon">▤</span>
            <span>All Tasks</span>
          </button>

          <button class="nav-item" data-filter="active">
            <span class="nav-icon">◷</span>
            <span>Active</span>
          </button>

          <button class="nav-item" data-filter="completed">
            <span class="nav-icon">✓</span>
            <span>Completed</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="plant-icon">♧</div>

          <p>Small steps<br />make big progress</p>

          <div class="heart">♥</div>
        </div>
      </aside>

      <!-- ================= MAIN CONTENT ================= -->
      <main class="main-content">
        <!-- TOP BAR -->
        <header class="top-bar">
          <div>
            <h1>My Tasks</h1>
            <p>Stay organized, focused and productive.</p>
          </div>

          <!-- Theme toggle -->
          <button
            id="themeToggle"
            class="theme-toggle"
            title="Toggle dark mode"
          >
            ☀
          </button>
        </header>

        <!-- ================= ADD TASK ================= -->
        <section class="add-task-section">
          <input
            type="text"
            id="taskInput"
            placeholder="What do you need to get done?"
            autocomplete="off"
          />

          <button id="addTaskBtn" class="add-task-btn">
            <span>＋</span>
            Add Task
          </button>
        </section>

        <!-- ================= FILTERS ================= -->
        <section class="filter-section">
          <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>

            <button class="filter-btn" data-filter="active">Active</button>

            <button class="filter-btn" data-filter="completed">
              Completed
            </button>
          </div>

          <button id="clearCompletedBtn" class="clear-btn">
            🗑 Clear Completed
          </button>
        </section>

        <!-- ================= TASK LIST ================= -->
        <section id="taskList" class="task-list">
          <!-- Tasks will be created here by TypeScript -->
        </section>

        <!-- ================= PROGRESS ================= -->
        <section class="progress-card">
          <div class="progress-text">
            <span id="remainingCount">0 tasks remaining</span>
          </div>

          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- TypeScript compiled JavaScript -->
    <script src="./dist/index.js" defer></script>
  </body>
</html>
